name: Publish Image

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coredns-redis-cache

jobs:
  build-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Prepare amd64 tags
        id: arch_tags
        run: |
          {
            echo "tags<<EOF"
            printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's|$|-amd64|'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-amd64
          cache-to: type=gha,mode=max,scope=publish-amd64

      - name: Sign amd64 image
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Extract and zip amd64 binary
        run: |
          set -eux
          cid="$(docker create --platform linux/amd64 "${IMAGE}@${{ steps.build.outputs.digest }}")"
          docker cp "$cid:/coredns" ./coredns
          docker rm "$cid"
          chmod +x ./coredns
          ref="${GITHUB_REF_NAME//\//-}"
          zip -j "coredns-redis-cache_${ref}_linux_amd64.zip" ./coredns

      - name: Upload amd64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-amd64
          path: coredns-redis-cache_*_linux_amd64.zip
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Prepare arm64 tags
        id: arch_tags
        run: |
          {
            echo "tags<<EOF"
            printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed 's|$|-arm64|'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-arm64
          cache-to: type=gha,mode=max,scope=publish-arm64

      - name: Sign arm64 image
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Extract and zip arm64 binary
        run: |
          set -eux
          cid="$(docker create --platform linux/arm64 "${IMAGE}@${{ steps.build.outputs.digest }}")"
          docker cp "$cid:/coredns" ./coredns
          docker rm "$cid"
          chmod +x ./coredns
          ref="${GITHUB_REF_NAME//\//-}"
          zip -j "coredns-redis-cache_${ref}_linux_arm64.zip" ./coredns

      - name: Upload arm64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: coredns-redis-cache_*_linux_arm64.zip
          if-no-files-found: error

  publish-manifest:
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publish and sign multi-arch manifests
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools create \
              -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            cosign sign "${IMAGE}@${digest}"
          done <<< "${{ steps.meta.outputs.tags }}"

  release-assets:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-amd64
      - build-arm64

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Create release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # Create and publish the release WITH the binaries attached in a single
          # step. Immutable-releases-safe: assets are present at publish time, so
          # the post-publish asset lock never has to be worked around.
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest
